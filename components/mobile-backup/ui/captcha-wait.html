<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ожидание CAPTCHA VK</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101720;color:#edf4f7;font:16px/1.6 system-ui}main{max-width:420px;padding:32px}small{color:#86e1c2;letter-spacing:.12em}h1{font-size:32px;line-height:1.2}p{color:#adbac8}</style><main><small>CYBERNETWORK / VK</small><h1>Окно для проверки готово</h1><p>Когда VK запросит CAPTCHA, открытая панель роутера направит сюда страницу проверки.</p><p>Оставьте панель «Резервный интернет» открытой. Если закрыть или перезагрузить её, включите ожидание заново.</p></main></html>
<script>if(new URLSearchParams(location.search).get('complete')==='1'){document.title='VK авторизован';document.querySelector('h1').textContent='VK готов к подключению';document.querySelectorAll('p')[0].textContent='Проверка пройдена. Роутер сохранил авторизацию и сможет использовать VK для обхода.';document.querySelectorAll('p')[1].textContent='Это окно можно закрыть. Панель роутера продолжит следить за состоянием каналов.';}</script><script>if(new URLSearchParams(location.search).get('expired')==='1'){document.title='Проверка VK завершилась';document.querySelector('h1').textContent='Эта проверка больше не активна';document.querySelectorAll('p')[0].textContent='Истекло время ожидания, проверка отменена или VK не ответил. Предыдущая авторизация сохранена.';document.querySelectorAll('p')[1].textContent='Вернитесь в панель роутера и нажмите «Обновить авторизацию», чтобы начать новую проверку.';}</script>
